# Static site plus one function.
#
# The previous functions directory held an unauthenticated Gemini proxy that
# forwarded any POST body straight to the model. Its replacement, narrate.js,
# accepts structured game state only and builds the prompt server-side — a
# caller cannot supply prompt text, so it cannot be used as a free LLM.
# Keep that property if you extend it.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/narrate"
  to = "/.netlify/functions/narrate"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pixel icons are content-addressed by name and change rarely.
[[headers]]
  for = "/assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
